[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-grading"
version = "0.1.0"
description = "Runnable baseline for automated grading and feedback on programming assignments"
requires-python = ">=3.10,<3.12"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyyaml>=6.0",
  "scikit-learn>=1.3",
  "tqdm>=4.66",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

ml = [
  "torch==2.14.1",
  "transformers==5.18.0",
  "accelerate==1.15.0",
  "peft==0.21.2",
  "sentence-transformers==6.1.0",
  "bitsandbytes>=0.49,<1; sys_platform != 'darwin'",
]

[project.optional-dependencies]
ml = [
  "torch==2.14.1",
  "transformers==5.18.0",
  "accelerate==1.15.0",
  "peft==0.21.2",
  "sentence-transformers==6.1.0",
  "bitsandbytes>=0.49,<1; sys_platform != 'darwin'",
]


[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
