[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-grading"
version = "0.1.0"
description = "Runnable baseline for automated grading and feedback on programming assignments"
requires-python = ">=3.10,<3.12"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyyaml>=6.0",
  "scikit-learn>=1.3",
  "tqdm>=4.66",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

ml = [
  "torch>=2.2",
  "transformers>=4.40",
  "datasets>=2.18",
  "accelerate>=0.28",
  "peft>=0.10",
  "trl>=0.8",
]

[tool.setuptools.packages.find]
where = ["src"]
