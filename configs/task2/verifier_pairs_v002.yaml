  max_sequence_length: 1024
  gradient_checkpointing: true
  time_budget_seconds: 1800
logging:
  logging_steps: 1
  report_to: []
saving:
  output_dir: outputs/task2-verifier-pairs-v002/kaggle
  save_strategy: steps
  save_steps: 16
