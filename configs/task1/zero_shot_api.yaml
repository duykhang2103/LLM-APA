experiment:
  id: task1-P0-v1
  name: task1_P0-v1
  notes: Change one hypothesis per version
task: task1
method: zero_shot
seed: 42
model:
  provider: api
  name_or_path: SET_PROVIDER_MODEL
  revision: null
  base_url: https://SET_PROVIDER/v1
  api_key_env: LLM_API_KEY
  allow_private_data: false
  timeout_seconds: 120
  cost_per_million_tokens: {}

prompt:
  version: v001
data:
  input_path: data/raw
  train_path: null
  validation_path: null
  test_path: null
  prepared_dir: data/processed/task1-v1
  dataset_version: lecturer-v1
  split_version: grouped-v1
  validation_fraction: 0.2
  test_fraction: 0
  max_samples: null
quantization:
  load_in_4bit: true
  quant_type: nf4
  double_quant: true
lora:
  rank: 8
  alpha: 16
  dropout: 0.05
  target_modules: all-linear
training:
  max_sequence_length: 4096
  learning_rate: 0.0001
  num_train_epochs: 3
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 4
  warmup_ratio: 0.06
  lr_scheduler_type: linear
  gradient_checkpointing: true
  max_steps: -1
  resume_from_checkpoint: null
  warm_start_adapter: null
  optim: adamw_torch
logging:
  logging_steps: 10
  report_to: []
saving:
  output_dir: outputs/task1/P0-v1
  save_strategy: epoch
  save_steps: 50
  save_total_limit: 2
evaluation:
  strategy: epoch
  eval_steps: 50
generation:
  do_sample: false
  temperature: 0
  max_input_tokens: 4096
  max_new_tokens: 192
  num_beams: 1
task1:
  use_compile_log: true
  use_test_report: true
