# Test-suite generation (scripts/generate_tests.py). A large model is fine
# here: it only writes tests and a reference solution from the statement and
# never sees student code or labels. Grading still uses the small model.
prompt_version: v001
model:
  provider: api
  name_or_path: openai/gpt-oss-120b
  base_url: https://api.groq.com/openai/v1
  api_key_env: GROQ_API_KEY
  allow_private_data: true
  timeout_seconds: 180
  # Approximate Groq list price; check console.groq.com for the current one.
  cost_per_million_tokens: {prompt: 0.15, completion: 0.60}
  max_cost_usd: 2
  cache_path: outputs/testgen/cache.jsonl
generation:
  temperature: 0.0
  # A reasoning model spends part of the budget thinking before the JSON.
  max_new_tokens: 16000
