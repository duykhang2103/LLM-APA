<svg xmlns="http://www.w3.org/2000/svg" width="1770" height="810" viewBox="0 0 1770 810" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/></marker></defs><rect width="1770" height="810" fill="#ffffff"/><text x="30" y="34" font-size="15" font-weight="700" fill="#7b8794" letter-spacing="0.5">ĐẦU VÀO</text><text x="330" y="34" font-size="15" font-weight="700" fill="#7b8794" letter-spacing="0.5">BẰNG CHỨNG CHẠY THẬT + RAG</text><text x="690" y="34" font-size="15" font-weight="700" fill="#7b8794" letter-spacing="0.5">PROMPT + LLM</text><text x="1030" y="34" font-size="15" font-weight="700" fill="#7b8794" letter-spacing="0.5">HẬU XỬ LÝ BẰNG CODE (THEO TASK)</text><text x="1500" y="34" font-size="15" font-weight="700" fill="#7b8794" letter-spacing="0.5">ĐẦU RA (ĐIỂM PUBLIC)</text><rect x="30" y="200" width="250" height="150" rx="10" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="1.6"/><text x="44" y="228" font-size="17" font-weight="700" fill="#1f2933">Bài cần chấm</text><text x="44" y="252" font-size="15" fill="#52606d">đề bài (statement)</text><text x="44" y="273" font-size="15" fill="#52606d">code C++ của sinh viên</text><text x="44" y="294" font-size="15" fill="#52606d">không đưa feedback</text><text x="44" y="315" font-size="15" fill="#52606d">vào Task 1/2</text><rect x="30" y="560" width="250" height="130" rx="10" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="1.6"/><text x="44" y="588" font-size="17" font-weight="700" fill="#1f2933">Train: 32 bài có nhãn</text><text x="44" y="612" font-size="15" fill="#52606d">EX01 (multi_problem, 15)</text><text x="44" y="633" font-size="15" fill="#52606d">EX02 (single_problem, 17)</text><text x="44" y="654" font-size="15" fill="#52606d">kho duy nhất cho RAG</text><rect x="330" y="105" width="300" height="140" rx="10" fill="#eef2f7" stroke="#9aa5b1" stroke-width="1.6"/><text x="344" y="133" font-size="17" font-weight="700" fill="#1f2933">Biên dịch thật (C++11)</text><text x="344" y="157" font-size="15" fill="#52606d">g++ hoặc clang (zig), relaxed</text><text x="344" y="178" font-size="15" fill="#52606d">multi_problem: chỉ kiểm tra cú pháp</text><text x="344" y="199" font-size="15" fill="#52606d">→ compile_log</text><rect x="330" y="270" width="300" height="205" rx="10" fill="#eef2f7" stroke="#9aa5b1" stroke-width="1.6"/><text x="344" y="298" font-size="17" font-weight="700" fill="#1f2933">Test do LLM sinh</text><text x="344" y="322" font-size="15" fill="#52606d">gpt-oss-120b, chỉ đọc đề bài</text><text x="344" y="343" font-size="15" fill="#52606d">lời giải tham chiếu phải khớp ví dụ</text><text x="344" y="364" font-size="15" fill="#52606d">7–16 test mỗi đề, 8 đề</text><text x="344" y="385" font-size="15" fill="#52606d">chạy code sinh viên → tỉ lệ pass</text><text x="344" y="406" font-size="15" fill="#52606d">→ test_report</text><rect x="330" y="540" width="300" height="170" rx="10" fill="#eef2f7" stroke="#9aa5b1" stroke-width="1.6"/><text x="344" y="568" font-size="17" font-weight="700" fill="#1f2933">RAG: BM25 trên code, k = 1</text><text x="344" y="592" font-size="15" fill="#52606d">kho = 32 bài train</text><text x="344" y="613" font-size="15" fill="#52606d">loại bài gần trùng (≥ 0.95)</text><text x="344" y="634" font-size="15" fill="#52606d">đánh giá: loại cùng đề (LOEO)</text><text x="344" y="655" font-size="15" fill="#52606d">ví dụ chỉ mang rubric / nhãn</text><rect x="690" y="250" width="280" height="150" rx="10" fill="#e8eefc" stroke="#4c6ef5" stroke-width="1.6"/><text x="704" y="278" font-size="17" font-weight="700" fill="#1f2933">Prompt theo task</text><text x="704" y="302" font-size="15" fill="#52606d">T1 v004 · T2 v004 · T3 v007</text><text x="704" y="323" font-size="15" fill="#52606d">luật giảng viên + mốc rubric</text><text x="704" y="344" font-size="15" fill="#52606d">+ compile_log, test_report</text><text x="704" y="365" font-size="15" fill="#52606d">+ 1 ví dụ truy xuất</text><rect x="690" y="470" width="280" height="140" rx="10" fill="#e8eefc" stroke="#4c6ef5" stroke-width="1.6"/><text x="704" y="498" font-size="17" font-weight="700" fill="#1f2933">Qwen3.5-9B (API)</text><text x="704" y="522" font-size="15" fill="#52606d">DeepInfra, temperature 0</text><text x="704" y="543" font-size="15" fill="#52606d">tắt reasoning, seed 42</text><text x="704" y="564" font-size="15" fill="#52606d">trả JSON hoặc văn bản</text><text x="704" y="585" font-size="15" fill="#52606d">khoảng 2–5 giây mỗi bài</text><rect x="1030" y="85" width="420" height="180" rx="10" fill="#e6f0fb" stroke="#2f6db3" stroke-width="1.6"/><text x="1044" y="113" font-size="17" font-weight="700" fill="#1f2933">Task 1: rubric 6 chiều</text><text x="1044" y="137" font-size="15" fill="#52606d">parse JSON, ép điểm vào miền cho phép</text><text x="1044" y="158" font-size="15" fill="#52606d">tổng điểm do code cộng, không để LLM sinh</text><text x="1044" y="179" font-size="15" fill="#52606d">guard (tùy chọn): compilable theo kết quả</text><text x="1044" y="200" font-size="15" fill="#52606d">biên dịch; bài biên dịch được mà bị chấm 0</text><text x="1044" y="221" font-size="15" fill="#52606d">→ thay bằng rubric luật (compile + pass)</text><rect x="1030" y="290" width="420" height="205" rx="10" fill="#e7f5ec" stroke="#2f8a4f" stroke-width="1.6"/><text x="1044" y="318" font-size="17" font-weight="700" fill="#1f2933">Task 2: nhãn lỗi</text><text x="1044" y="342" font-size="15" fill="#52606d">calibrate: "Lỗi biên dịch" theo kết quả compile;</text><text x="1044" y="363" font-size="15" fill="#52606d">bài qua hết test chỉ giữ style, hard-code, nhập/xuất</text><text x="1044" y="384" font-size="15" fill="#52606d">+ hỏi Có/Không từng nhãn (10 lần mỗi bài)</text><text x="1044" y="405" font-size="15" fill="#52606d">→ thêm 3 nhãn hiếm: thuật toán, hard-code, style</text><rect x="1030" y="525" width="420" height="190" rx="10" fill="#fdf1e4" stroke="#c26a12" stroke-width="1.6"/><text x="1044" y="553" font-size="17" font-weight="700" fill="#1f2933">Task 3: phản hồi theo level</text><text x="1044" y="577" font-size="15" fill="#52606d">chẩn đoán = nhãn của Task 2</text><text x="1044" y="598" font-size="15" fill="#52606d">feedback v007: ngắn như giảng viên, xưng "em"</text><text x="1044" y="619" font-size="15" fill="#52606d">kiểm tra level bằng code (không lộ code,</text><text x="1044" y="640" font-size="15" fill="#52606d">không nêu cách sửa ở Level 1–2)</text><text x="1044" y="661" font-size="15" fill="#52606d">vi phạm → sinh lại tối đa 2 lần</text><rect x="1500" y="130" width="240" height="95" rx="10" fill="#ffffff" stroke="#52606d" stroke-width="1.6"/><text x="1514" y="158" font-size="17" font-weight="700" fill="#1f2933">Task 1</text><text x="1514" y="182" font-size="15" fill="#52606d">rubric + total</text><text x="1514" y="203" font-size="15" fill="#52606d">QWK 0.8748</text><rect x="1500" y="345" width="240" height="95" rx="10" fill="#ffffff" stroke="#52606d" stroke-width="1.6"/><text x="1514" y="373" font-size="17" font-weight="700" fill="#1f2933">Task 2</text><text x="1514" y="397" font-size="15" fill="#52606d">taxonomy_error</text><text x="1514" y="418" font-size="15" fill="#52606d">macro-F1 0.2917</text><rect x="1500" y="565" width="240" height="95" rx="10" fill="#ffffff" stroke="#52606d" stroke-width="1.6"/><text x="1514" y="593" font-size="17" font-weight="700" fill="#1f2933">Task 3</text><text x="1514" y="617" font-size="15" fill="#52606d">taxonomy_error + feedback</text><text x="1514" y="638" font-size="15" fill="#52606d">điểm judge 0.3948</text><path d="M280,275 L305,275 L305,175 L330,175" fill="none" stroke="#7b8794" stroke-width="1.8" marker-end="url(#arr)"/><path d="M305,275 L305,372 L330,372" fill="none" stroke="#7b8794" stroke-width="1.8" marker-end="url(#arr)"/><path d="M280,625 L330,625" fill="none" stroke="#7b8794" stroke-width="1.8" marker-end="url(#arr)"/><path d="M155,200 L155,72 L830,72 L830,250" fill="none" stroke="#7b8794" stroke-width="1.8" marker-end="url(#arr)"/><text x="470" y="64" font-size="13.5" fill="#52606d" font-style="italic" text-anchor="start">đề bài + code đưa thẳng vào prompt</text><path d="M630,175 L660,175 L660,290 L690,290" fill="none" stroke="#7b8794" stroke-width="1.8" marker-end="url(#arr)"/><path d="M630,372 L690,372" fill="none" stroke="#7b8794" stroke-width="1.8" marker-end="url(#arr)"/><path d="M630,625 L660,625 L660,388 L690,388" fill="none" stroke="#7b8794" stroke-width="1.8" marker-end="url(#arr)"/><path d="M830,400 L830,470" fill="none" stroke="#7b8794" stroke-width="1.8" marker-end="url(#arr)"/><path d="M970,540 L1000,540 L1000,175 L1030,175" fill="none" stroke="#7b8794" stroke-width="1.8" marker-end="url(#arr)"/><path d="M1000,392 L1030,392" fill="none" stroke="#7b8794" stroke-width="1.8" marker-end="url(#arr)"/><path d="M1000,540 L1000,620 L1030,620" fill="none" stroke="#7b8794" stroke-width="1.8" marker-end="url(#arr)"/><path d="M1450,177 L1500,177" fill="none" stroke="#7b8794" stroke-width="1.8" marker-end="url(#arr)"/><path d="M1450,392 L1500,392" fill="none" stroke="#7b8794" stroke-width="1.8" marker-end="url(#arr)"/><path d="M1450,612 L1500,612" fill="none" stroke="#7b8794" stroke-width="1.8" marker-end="url(#arr)"/><path d="M1620,440 L1620,505 L1250,505 L1250,525" fill="none" stroke="#2f8a4f" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arr)"/><text x="1540" y="527" font-size="13.5" fill="#52606d" font-style="italic" text-anchor="middle">nhãn Task 2 → Task 3</text><line x1="30" y1="740" x2="1740" y2="740" stroke="#d9e2ec"/><text x="30" y="772" font-size="15" fill="#52606d">Đánh giá offline: leave-one-exam-out trên 32 bài train (EX01 ↔ EX02). Seed 42; mọi response API được cache để chạy lại. Không có bước nào cập nhật trọng số model.</text></svg>