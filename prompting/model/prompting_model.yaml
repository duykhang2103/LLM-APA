# "Model" của hướng Prompting sau khi tối ưu (bản tốt nhất trên leaderboard public, 2026-11-25).
#
# Hướng prompting không huấn luyện trọng số nào. Phần đã tối ưu là cách dùng một
# LLM có sẵn: model, prompt, RAG, bằng chứng biên dịch/test và hậu xử lý.
# File này chốt toàn bộ các lựa chọn đó. prompting/run_prompting.py đọc file này
# để chạy lại đúng pipeline đã nộp, nên muốn đổi gì thì đổi ở đây.

name: prompting-qwen35-9b-best
public_scores:                 # điểm leaderboard public của bản tốt nhất
  task1_qwk: 0.8817
  task2_macro_f1: 0.3027
  task3_llm_judge: 0.4223     # prompt v008 (bản v007 trước đó: 0.3948)

llm:                           # LLM chấm bài (cả 3 task)
  model: Qwen/Qwen3.5-9B       # open-weight 9B; DeepInfra không có Qwen3.5-4B
  base_url: https://api.deepinfra.com/v1/openai
  api_key_env: DEEPINFRA_API_KEY
  reasoning_effort: none       # tắt suy luận ẩn để trả lời gọn trong giới hạn token
  temperature: 0               # trong configs/task*/rag.yaml (do_sample: false)
  price_usd_per_million: [0.10, 0.15]   # prompt, completion; dùng cho --max-cost

test_generation:               # bước sinh test (chỉ đọc đề, không thấy code sinh viên)
  config: configs/testgen/groq.yaml     # openai/gpt-oss-120b qua Groq, cần GROQ_API_KEY
  suites_dir: outputs/testsuites        # bộ test đã sinh; có sẵn thì không gọi lại API

retrieval:                     # RAG
  method: rag                  # P2 = RAG + bằng chứng biên dịch/test
  index: bm25
  key: code
  k: 1
  pool: 32 bài train có nhãn (sample_dataset)

task1:
  prompt: tasks/task1_grading/prompts/v004.txt
  submit: submission_task1.json          # P2 thuần (không guard) + xử lý bài comment toàn bộ, public 0.8817
  max_cost_usd: 0.6
  cache: outputs/di9b-cache-2.jsonl

task2:
  list_prompt: tasks/task2_errors/prompts/v004.txt   # prompt liệt kê nhãn (giữ v004: v007 kém hơn trên train)
  calibration: scripts/calibrate_task2.py           # luật dựa trên bằng chứng, áp cho mọi cách hỏi
  per_label_threshold: 0.5
  per_label_workers: 8
  per_label_max_cost_usd: 1.5
  # Hỏi Yes/No từng nhãn, bản mới: định nghĩa nhãn theo cách giảng viên dùng + 2 bài train
  # có nhãn (đề khác) làm ví dụ. Dùng cho 3 nhãn hiếm.
  rare_labels_prompt: tasks/task2_errors/prompts/per_label_v002.json
  rare_label_examples: 2
  combine_rare_labels: ["Lỗi thuật toán", "Lỗi hard-code", "Lỗi style"]
  # Hỏi Yes/No từng nhãn, bản cũ: nguồn của nhãn "Lỗi edge case" trong file nộp tốt nhất.
  edge_case_prompt: tasks/task2_errors/prompts/per_label_v001.json
  # cache của cách hỏi từng nhãn: outputs/api_cache-perlabel.jsonl (mặc định của run_all.py)

task3:
  prompt: v008                 # tasks/task3_feedback/prompts/v008.txt
  labels_from: task2_final     # nhãn = file nộp Task 2 cuối cùng
  shards: 6
  max_cost_usd: 0.6
  # cache: outputs/api_cache.jsonl (mặc định của run_all.py)
  postprocess: scripts/relabel_task3.py   # chuẩn hoá Level 1, cắt lời khuyên ở Level 2, đồng bộ nhãn
